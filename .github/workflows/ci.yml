name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Never set OPENAI_* / AZURE_OPENAI_* / DATASET_SOURCE here: the mock must stay offline in CI.
  NO_LLM_API_LIVE: ""
  INSTA_UPDATE: "no"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - run: npm --prefix e2e test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: no-llm-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run --detach --read-only --name no-llm-api-ci -p 127.0.0.1:8080:8080 no-llm-api:ci
          for attempt in $(seq 1 30); do
            if docker exec no-llm-api-ci /app/no-llm-api health --url http://127.0.0.1:8080/ready; then
              curl --fail --silent http://127.0.0.1:8080/ > /dev/null
              curl --fail --silent http://127.0.0.1:8080/ready > /dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs no-llm-api-ci
          exit 1
      - if: always()
        run: docker rm --force no-llm-api-ci || true

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject path dependencies
        run: |
          if grep -nE '^[[:space:]]*[A-Za-z0-9_-]+[[:space:]]*=.*\bpath[[:space:]]*=' Cargo.toml; then
            echo "path dependency found in Cargo.toml"; exit 1
          fi
          if grep -n 'source = "path' Cargo.lock; then
            echo "path dependency found in Cargo.lock"; exit 1
          fi
      - name: Build from a pristine clone
        run: |
          git clone --depth 1 "file://$PWD" /tmp/fresh
          cd /tmp/fresh
          test ! -d async-openai && test ! -d openai-func-enums
          cargo build --locked --all-targets
          cargo test --locked --all-targets

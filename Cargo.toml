[package]
name = "no-llm-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "tokio"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.4"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
parquet = { version = "53", features = ["arrow"] }
arrow-array = "53"
arrow-schema = "53"
bytes = "1"
futures = "0.3"
http = "1"
dotenvy = "0.15"
indexmap = "2"
once_cell = "1"

[dev-dependencies]
axum = { version = "0.7", features = ["macros", "json", "tokio"] }
tokio = { version = "1.40", features = ["macros", "rt", "time"] }
serde_json = "1.0"
tower = "0.4"
tempfile = "3"

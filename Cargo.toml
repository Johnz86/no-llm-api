[package]
name = "no-llm-api"
version = "0.1.0"
edition = "2024"

[lib]
name = "no_llm_api"
path = "src/lib.rs"

[[bin]]
name = "no-llm-api"
path = "src/main.rs"

[[bin]]
name = "recorder"
path = "src/bin/recorder.rs"

[[bin]]
name = "regenerate_dataset"
path = "src/bin/regenerate_dataset.rs"

[dependencies]
axum = { version = "0.8.6", features = ["macros", "json", "tokio"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "signal", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
anyhow = "1.0.100"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tower = "0.5.2"
tokio-stream = "0.1.17"
uuid = { version = "1.18.1", features = ["v4"] }
parquet = { version = "57.0.0", features = ["arrow"] }
arrow-array = "57.0.0"
arrow-schema = "57.0.0"
bytes = "1.10.1"
futures = "0.3.31"
http = "1.3.1"
dotenvy = "0.15.7"
indexmap = "2.12.0"
once_cell = "1.21.3"
tiktoken-rs = "0.7.0"
async-openai = { path = "async-openai/async-openai" }
clap = { version = "4.5.13", features = ["derive"] }

[dev-dependencies]
axum = { version = "0.8.6", features = ["macros", "json", "tokio"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }
serde_json = "1.0.145"
tower = "0.5.2"
tempfile = "3.23.0"

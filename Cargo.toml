[package]
name = "no-llm-api"
version = "0.1.0"
edition = "2024"

[lib]
name = "no_llm_api"
path = "src/lib.rs"

[[bin]]
name = "no-llm-api"
path = "src/main.rs"

[[bin]]
name = "recorder"
path = "src/bin/recorder.rs"

[[bin]]
name = "regenerate_dataset"
path = "src/bin/regenerate_dataset.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "json", "tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "signal", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = "0.5.3"
tokio-stream = "0.1.19"
uuid = { version = "1.24.0", features = ["v4"] }
parquet = { version = "59.1.0", features = ["arrow"] }
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
bytes = "1.12.1"
futures = "0.3.33"
http = "1.4.2"
dotenvy = "0.15.7"
indexmap = "2.14.0"
once_cell = "1.21.4"
tiktoken-rs = "0.12.0"
async-openai = { version = "0.41.1", features = ["chat-completion", "model"] }
clap = { version = "4.6.4", features = ["derive"] }
async-stream = "0.3.6"
tower-http = { version = "0.7.0", features = ["cors"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["macros", "json", "tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
serde_json = "1.0.151"
tower = "0.5.3"
tempfile = "3.27.0"
http-body-util = "0.1.3"

schema_version: 2
id: reasoning-effort
description: Authored effort variants with public summaries and a stable visible answer.
tags: [reasoning, effort]
interfaces: [chat_completions, responses]
match:
  models: [mock-reasoner]
  turns:
    - role: user
      text: Which release should ship?
requirements:
  reasoning: true
cases:
  - id: release-decision
    constraints:
      interfaces: [chat_completions, responses]
      efforts: [low, medium, high]
    default_variant: medium
    fallback_variant: medium
    variants:
      low:
        reasoning_summary: Checked readiness and blockers.
        reasoning_trace: Checked readiness and blockers.
        reasoning_tokens: 8
        answer: Ship release B.
      medium:
        reasoning_summary: Compared readiness, blockers, and rollback coverage.
        reasoning_trace: Compared readiness, blockers, and rollback coverage.
        reasoning_tokens: 16
        answer: Ship release B.
      high:
        reasoning_summary: Compared readiness, blockers, rollback coverage, ownership, and recovery time.
        reasoning_trace: Compared readiness, blockers, rollback coverage, ownership, and recovery time.
        reasoning_tokens: 28
        answer: Ship release B.
    terminal: completed
